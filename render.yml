name: Render STL & previews

# Автоматически пересобирает STL для каждой детали и PNG-превью
# сборки при любом пуше, затрагивающем *.scad. Готовые файлы
# доступны во вкладке Actions -> Artifacts, без установки OpenSCAD
# на своей машине.
on:
  push:
    paths:
      - "scad/**.scad"
      - ".github/workflows/render.yml"
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Render STL for every printable part
        run: |
          mkdir -p out
          declare -A parts=(
            [generator]=generator
            [cold_orifice_plate]=cold_orifice_plate
            [hot_tube]=hot_tube
            [valve_housing]=valve_housing
            [valve_rod]=valve_rod
            [chamber_body]=chamber_body
            [lid]=lid
            [tray]=tray
          )
          for name in "${!parts[@]}"; do
            openscad -o "out/${name}.stl" -D "part=\"${parts[$name]}\"" scad/main.scad
          done

      - name: Render assembly preview PNG
        run: |
          openscad -o out/assembly_preview.png \
            --imgsize=1600,1200 --colorscheme=Tomorrow \
            -D 'part="all"' scad/main.scad

      - name: Upload STL + preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eco-dryer-stl
          path: out/
          if-no-files-found: error
